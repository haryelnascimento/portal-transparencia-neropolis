name: Publicar portal
on:
  push:
    branches: [main]
  # Pushes feitos com GITHUB_TOKEN não disparam outros workflows; por isso o deploy
  # também escuta a conclusão da atualização diária de dados.
  workflow_run:
    workflows: [Atualizar dados]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build -- --base-href /${{ github.event.repository.name }}/
        working-directory: frontend
      # GitHub Pages não tem fallback de SPA: o 404.html carrega o app e o roteador abre a URL pedida.
      - run: cp frontend/dist/portal/browser/index.html frontend/dist/portal/browser/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/dist/portal/browser }
      - id: deployment
        uses: actions/deploy-pages@v4
