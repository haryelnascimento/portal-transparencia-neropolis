name: Atualizar dados
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Testar ETL
        run: python -m unittest discover -s etl/tests
      - name: Coletar e exportar
        env:
          TRANSPARENCIA_API_TOKEN: ${{ secrets.TRANSPARENCIA_API_TOKEN }}
        run: python -m etl
      - name: Versionar atualização
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/normalized frontend/public/data
          git diff --cached --quiet || git commit -m "data: atualização automática $(date -u +%F)"
          git push

